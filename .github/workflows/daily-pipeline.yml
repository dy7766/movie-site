name: 🎬 Daily Media Automation Pipeline

on:
  # 统一由 Cloudflare 全球边缘 Worker 独家高优先级准点调度 (北京时间 08:30 / 12:00 / 20:30 / 23:00)
  workflow_dispatch: # 支持 Cloudflare API 与 GitHub 网页端一键实时触发

concurrency:
  group: media-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: 🚀 巡检、探活、转存与自动化大盘
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 检出最新代码
        uses: actions/checkout@v4

      - name: ⚡ 安装 Node.js 运行环境 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm ci

      - name: 🚀 执行全自动运营中枢调度器
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          UC_COOKIE: ${{ secrets.UC_COOKIE }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_ALERT_PHONE: ${{ secrets.DINGTALK_ALERT_PHONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          set -o pipefail
          node scripts/pipeline-runner.js 2>&1 | tee pipeline-execution.log

      - name: 📤 上传全流程执行过程日志 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-process-log-${{ github.run_id }}
          path: pipeline-execution.log
          retention-days: 7

      - name: 🏗️ 验证 Astro 全站静态预渲染构建
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run build

      - name: 🌐 触发 Cloudflare Pages 线上重新发布 (Deploy Hook)
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        if: env.CLOUDFLARE_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "$CLOUDFLARE_DEPLOY_HOOK"
          echo "✓ Cloudflare Pages 部署钩子已触发！"
