name = "movie-pipeline-watchdog"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cloudflare 全球边缘定时主控调度器 (Cron Triggers)
# 每天 4 大黄金档准点主控执行：
# 1. 晨间早盘: 08:30 (UTC 00:30)
# 2. 午间热播: 12:00 (UTC 04:00)
# 3. 晚间高峰: 20:30 (UTC 12:30)
# 4. 夜间追剧: 23:00 (UTC 15:00)
# 利用单条多时间段语法，完美符合免费版限制 (共 2 条规则 <= 3)
[triggers]
crons = [
  "30 0,12 * * *",   # 每天北京时间 08:30 和 20:30 (UTC 00:30, 12:30)
  "0 4,15 * * *"     # 每天北京时间 12:00 和 23:00 (UTC 04:00, 15:00)
]

